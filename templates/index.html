<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>

    <h1>Cadastro</h1>

    <label>
        Nome:
        <input type="text" id="nome">
    </label>

    <br><br>

    <p>
        Para continuar, você pode permitir que este site
        acesse sua localização.
    </p>

    <button id="localizacao">
        Permitir localização
    </button>

    <p id="status"></p>

    <script>
        const botao = document.getElementById("localizacao");
        const status = document.getElementById("status");

        botao.addEventListener("click", () => {
            if (!navigator.geolocation) {
                status.textContent =
                    "Seu navegador não oferece geolocalização.";
                return;
            }

            status.textContent =
                "Solicitando permissão de localização...";

            navigator.geolocation.getCurrentPosition(
                (posicao) => {
                    const precisao =
                        Math.round(posicao.coords.accuracy);

                    status.textContent =
                        "Localização permitida. Precisão aproximada: "
                        + precisao + " metros.";
                },
                () => {
                    status.textContent =
                        "A localização não foi autorizada.";
                }
            );
        });
    </script>

</body>
</html>
